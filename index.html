<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>조리교육 통합관리 · 커리큘럼/체크리스트/교육일지</title>
<style>
:root{--navy:#1f3864;--blue:#2f5496;--line:#dcdfe6;--bg:#f4f6f9;--ok:#1f7a44;--warn:#c0392b;--mut:#6b7280;--gold:#b8860b}
*{box-sizing:border-box}
body{margin:0;font-family:"맑은 고딕","Malgun Gothic",sans-serif;background:var(--bg);color:#1d2733;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:700}
.sp{flex:1}
.btn{background:#fff;color:var(--navy);border:1px solid #c9d3e0;border-radius:6px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:#fff;border-color:#5a73a8}.btn.ghost:hover{background:#2a4575}
.btn.gold{background:var(--gold);color:#fff;border:none}
.btn.go{background:var(--ok);color:#fff;border:none;padding:9px 18px;font-size:14px}
.btn.warn{background:#fbeaea;color:var(--warn);border-color:#e3b7b3}
.wrap{padding:18px;max-width:1080px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h2{margin:0 0 4px;font-size:18px;color:var(--navy)}
.card .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
label.f{display:block;font-size:12.5px;color:#33415c;font-weight:700;margin:12px 0 5px}
input,select{font-family:inherit;font-size:14px;border:1px solid #c9d3e0;border-radius:7px;padding:8px 10px}
input.w{width:100%;max-width:340px}
.brandpick{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.bp{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700;color:#444;min-width:150px;display:flex;align-items:center;gap:9px;background:#fff}
.bp.on{border-color:var(--navy);background:#eef2fb;color:var(--navy)}
.bp input{width:18px;height:18px;accent-color:var(--navy)}
.bp .m{font-size:11px;color:var(--mut);font-weight:500}
.overall{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.bar{height:12px;background:#eef0f4;border-radius:8px;overflow:hidden}.bar > i{display:block;height:100%;background:linear-gradient(90deg,#2f5496,#1f7a44);width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#fff;border:1.5px solid var(--line);color:#555;border-radius:22px;padding:9px 18px;font-weight:700;cursor:pointer;font-size:14px}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.tab .p{font-size:11px;opacity:.85;margin-left:6px}
.metabar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.metabar b{color:var(--navy)}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.sec h3{margin:0;background:#eef2f8;color:var(--navy);font-size:14px;padding:9px 14px;display:flex;align-items:center;gap:8px}
.sec h3 .c{flex:1}.sec h3 .cnt{font-size:12px;color:var(--mut);font-weight:600}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid #eef0f4;padding:7px 10px;text-align:center}
th{background:#f7faff;color:#33415c;font-weight:700;font-size:12px}
td.t,th.t{text-align:left}td.t{font-weight:600}
tr.done td{background:#f2faf5}
.ck{width:20px;height:20px;cursor:pointer;accent-color:#1f7a44}
.note{width:96%;border:1px solid #e3e9f3;border-radius:5px;padding:4px 6px;font-size:12px}
.del{color:var(--warn);cursor:pointer;font-weight:700}
.ce[contenteditable="true"]{outline:1px dashed #c9d3e0;border-radius:4px;padding:1px 4px}
.ce[contenteditable="true"]:focus{outline:2px solid var(--gold);background:#fffdf5}
.mut{color:var(--mut);font-size:12px}
.note-i{background:#fff8e6;border:1px solid #f1e2b6;color:#7a5b00;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.admin-brand{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.admin-brand > .bh{background:var(--navy);color:#fff;padding:8px 14px;display:flex;gap:8px;align-items:center;font-weight:700}
.admin-brand .bh .ce{color:#fff}
.admin-sec{padding:8px 14px;border-bottom:1px solid #f0f0f0}
.admin-sec .sh{font-weight:700;color:var(--navy);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.admin-item{display:flex;gap:8px;align-items:center;padding:2px 0 2px 14px;font-size:13px}
.hide{display:none}
footer{padding:16px;text-align:center;color:var(--mut);font-size:12px}

/* 커리큘럼 */
.curr table{table-layout:fixed}
.curr th{font-size:12px}
.curr td{vertical-align:top;text-align:left;font-size:12.5px}
.curr td.tm{text-align:center;font-weight:700;color:var(--navy);white-space:nowrap;width:104px}
.curr td.md,.curr td.ow{text-align:center;width:88px;color:#4a5568}
.curr .ce[contenteditable="true"]{display:block;min-height:20px}
.daymeta{background:#eef2fb;border:1px solid #d6e0f5;border-radius:9px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.daymeta b{color:var(--navy)}
.goal{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.65}

/* 교육일지 */
.logform label.f{margin-top:14px}
textarea{font-family:inherit;font-size:13.5px;border:1px solid #c9d3e0;border-radius:7px;padding:9px 11px;width:100%;line-height:1.6;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.prog-inline{background:#f7faff;border:1px solid #dfe7f5;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:6px}
.prog-inline .row{display:flex;justify-content:space-between;padding:3px 0}
.signwrap{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.signbox{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;flex:1;min-width:270px}
.signbox .lbl{font-size:12.5px;font-weight:700;color:#33415c;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.signbox .lbl .sp{flex:1}
.sigpad{border:1px dashed #bcc7d8;border-radius:7px;background:#fcfdff;touch-action:none;display:block;width:100%;height:110px;cursor:crosshair}
.sigmeta{font-size:11.5px;color:var(--mut);margin-top:5px}
.sigdone{border-color:var(--ok);background:#f7fdf9}
.chip{display:inline-block;background:#eef2fb;color:var(--navy);border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:700}
.chip.done{background:#e8f6ee;color:var(--ok)}

@media print{
  header,footer,.metabar,.tabs .p,.del,.note-i{display:none!important}
  body{background:#fff;font-size:11.5px}
  .wrap{padding:0;max-width:none}
  .tab{display:none}.tab.on{display:inline-block}
  .sec,.signbox,.card{break-inside:avoid}
  .btn{display:none!important}
  textarea,input{border:none;border-bottom:1px solid #bbb;border-radius:0;padding:2px 0}
  textarea{resize:none;overflow:visible;height:auto}
  .sigpad{border:1px solid #999}
  .prn-only{display:block!important}
}
.prn-only{display:none}
.syncbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px}
.sdot{width:9px;height:9px;border-radius:50%;background:#c4ccd8;display:inline-block}
.sdot.on{background:#1f7a44}.sdot.err{background:#c0392b}.sdot.wait{background:#b8860b}
.syncmsg{display:none;margin-top:10px;padding:10px 13px;border-radius:8px;font-size:12.5px;line-height:1.6;border:1px solid #dfe7f5;background:#f7faff;color:#33415c}
.syncmsg.err{border-color:#e3b7b3;background:#fbeaea;color:#8e2c22}
.syncmsg.ok{border-color:#bfe3cd;background:#f0faf4;color:#1f7a44}
.syncnote{background:#f7faff;border:1px solid #dfe7f5;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#33415c;line-height:1.65;margin-top:10px}

function syncReq(opt){
  var url=(SY.url||'').trim().replace(/\s+/g,'');
  if(!/^https:\/\//i.test(url))
    return Promise.resolve({ok:false,err:'주소가 <b>https://</b> 로 시작하지 않습니다. Apps Script 배포 화면의 웹 앱 URL을 그대로 붙여넣으십시오.'});
  if(/\/dev$/.test(url))
    return Promise.resolve({ok:false,err:'주소가 <b>/dev</b> 로 끝납니다. 이 주소는 본인 계정 로그인 상태에서만 열립니다. 배포 화면의 <b>/exec</b> 주소를 사용하십시오.'});
  if(!/\/exec$/.test(url))
    return Promise.resolve({ok:false,err:'주소가 <b>/exec</b> 로 끝나야 합니다. 현재 입력값을 확인하십시오.'});
  var req=opt.post
    ? fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(opt.post),redirect:'follow'})
    : fetch(url+'?'+opt.get,{method:'GET',redirect:'follow'});
  return req.then(function(r){return r.text().then(function(t){return{status:r.status,text:t};});})
   .then(function(res){
     var t=(res.text||'').trim();
     if(res.status>=400)
       return{ok:false,err:'서버가 오류를 반환했습니다 (HTTP '+res.status+'). 배포가 완료되었는지, 주소가 최신 배포의 것인지 확인하십시오.'};
     if(t.charAt(0)!=='{'){
       if(/accounts\.google\.com|ServiceLogin|signin\/v2|계정에 로그인/i.test(t))
         return{ok:false,err:'로그인 화면이 돌아왔습니다. Apps Script <b>배포 → 배포 관리 → 수정</b>에서 <b>액세스 권한이 있는 사용자</b>를 <b>모든 사용자</b>로 바꾸고, 버전을 <b>새 버전</b>으로 지정해 다시 배포하십시오.'};
       if(/Script function not found|스크립트 함수를 찾을 수 없/i.test(t))
         return{ok:false,err:'스크립트에 doGet 또는 doPost 함수가 없습니다. Code.gs 내용을 다시 붙여넣고 저장한 뒤 새 버전으로 재배포하십시오.'};
       if(/authorization|권한|승인이 필요/i.test(t))
         return{ok:false,err:'스크립트 권한 승인이 완료되지 않았습니다. Apps Script 편집기에서 doGet 함수를 한 번 실행해 권한을 허용한 뒤 재배포하십시오.'};
       return{ok:false,err:'JSON이 아닌 응답을 받았습니다. 웹 앱 주소가 올바른지 확인하십시오. 브라우저 주소창에 해당 URL을 직접 열어보면 원인을 확인할 수 있습니다.'};
     }
     try{return{ok:true,data:JSON.parse(t)};}catch(x){return{ok:false,err:'응답 내용을 해석하지 못했습니다.'};}
   })
   .catch(function(e){
     var h='<b>서버에 연결하지 못했습니다.</b> 아래를 순서대로 확인하십시오.<br><br>';
     if(inFrame())
       h+='<b>0. 지금 미리보기 화면에서 보고 계신 경우</b><br>내장된 미리보기 창에서는 외부 서버 요청이 차단됩니다. GitHub Pages 주소나 내려받은 파일을 <b>브라우저 새 탭에서 직접 열어</b> 다시 시도하십시오.<br><br>';
     h+='<b>1. 액세스 권한 (가장 흔한 원인)</b><br>Apps Script <b>배포 → 배포 관리 → 연필 아이콘</b>에서 <b>액세스 권한이 있는 사용자</b>가 <b>모든 사용자</b>인지 확인하십시오. <b>나만</b>으로 두면 구글 로그인 페이지로 넘어가면서 이 오류가 발생합니다.<br><br>'+
        '<b>2. 재배포 여부</b><br>설정을 바꾼 뒤 버전을 <b>새 버전</b>으로 지정해 다시 배포해야 반영됩니다. 기존 배포를 수정만 하고 저장하지 않으면 그대로입니다.<br><br>'+
        '<b>3. 주소 확인</b><br>아래 [주소 직접 열기] 버튼으로 새 탭에서 응답을 확인하십시오. JSON이 보이면 서버는 정상입니다.<br>'+
        '<span class="mut">상세: '+esc(e&&e.message?e.message:String(e))+'</span>';
     return{ok:false,err:h};
   });
}

function pullSync(silent){
  if(!syncOn()){if(!silent)syncSt('err','동기화 주소와 접속 코드를 먼저 입력하십시오.');return;}
  syncSt('wait','불러오는 중…');
  syncReq({get:'action=load&code='+encodeURIComponent(SY.code)+'&key='+encodeURIComponent(syncKey())}).then(function(r){
    if(!r.ok){syncSt('err',r.err);return;}
    var d=r.data;
    if(!d.ok){syncSt('err','불러오기 실패: '+esc(d.error||'알 수 없는 오류'));return;}
    if(!d.found){SY.rev=0;saveSy();syncSt('on','서버에 저장된 기록이 없습니다. 작성 후 저장하면 새로 생성됩니다.');return;}
    if(d.tpl&&d.tpl.brands){TPL=d.tpl;lsSet(LS_TPL,JSON.stringify(TPL));}
    if(d.st&&d.st.checks){ST=d.st;lsSet(LS_ST,JSON.stringify(ST));}
    SY.rev=d.rev||0;saveSy();
    syncSt('on','불러왔습니다 · '+fmtTime(d.updated)+(d.by?' · '+esc(d.by):''));
    render();
  });
}
function pushSync(force){
  if(!syncOn()||SY.busy)return;SY.busy=true;syncSt('wait','저장 중…');
  syncReq({post:{code:SY.code,key:syncKey(),base:SY.rev,force:!!force,by:SY.by||ST.info.mgr||'',tpl:TPL,st:ST}}).then(function(r){
    SY.busy=false;
    if(!r.ok){syncSt('err',r.err);return;}
    var d=r.data;
    if(d.conflict){syncSt('err','다른 기기에서 먼저 저장한 기록이 있습니다.');
      if(confirm('다른 기기에서 먼저 저장한 기록이 있습니다.\n\n[확인] 서버 기록을 불러옵니다 (현재 화면의 입력은 사라집니다)\n[취소] 현재 화면 내용으로 덮어씁니다')){
        if(d.tpl&&d.tpl.brands){TPL=d.tpl;lsSet(LS_TPL,JSON.stringify(TPL));}
        if(d.st&&d.st.checks){ST=d.st;lsSet(LS_ST,JSON.stringify(ST));}
        SY.rev=d.rev||0;saveSy();syncSt('on','서버 기록을 적용했습니다.');render();
      }else{pushSync(true);}
      return;}
    if(!d.ok){syncSt('err','저장 실패: '+esc(d.error||''));return;}
    SY.rev=d.rev;saveSy();syncSt('on','저장됨 · '+fmtTime(d.updated));
  });
}

function cbox(b,s,it,k,v){return '<td><input type="checkbox" class="ck" '+(v?'checked':'')+' onchange="ck(\''+js(b)+'\',\''+js(s)+'\',\''+js(it)+'\',\''+k+'\',this.checked)"></td>';}
function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function cssid(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return 'x'+h;}

function sigBox(k,label,L){
  const on=!!L['sig'+k];
  return '<div class="signbox'+(on?' sigdone':'')+'"><div class="lbl"><span>'+label+'</span>'+
    (on?'<span class="chip done">서명 완료</span>':'<span class="chip">미서명</span>')+
    '<span class="sp"></span><button class="btn" style="padding:2px 9px;font-size:11px" onclick="clearSig(\''+k+'\')">지우기</button></div>'+
    '<canvas class="sigpad" id="pad'+k+'"></canvas>'+
    '<div class="sigmeta">'+esc(k==='T'?(ST.info.name||'교육생'):(ST.info.mgr||'교육 담당자'))+' (서명)</div></div>';
}
function setLog(k,v){const L=LG();L[k]=v;saveSt();}
function fillFromCur(){const c=CUR()[ST.dayActive];if(!c)return;
  const txt=c.blocks.filter(b=>b.s&&b.s!=='중식').map(b=>'· ['+b.t+'] '+b.s+(b.d?' — '+b.d:'')).join('\n');
  const L=LG();L.content=(L.content?L.content+'\n':'')+txt;saveSt();renderLog();}
function initPads(){
  ['T','M'].forEach(k=>{
    const c=document.getElementById('pad'+k);if(!c)return;
    const r=c.getBoundingClientRect();c.width=Math.max(240,Math.round(r.width));c.height=110;
    const x=c.getContext('2d');
    const src=LG()['sig'+k];
    if(src){const img=new Image();img.onload=function(){x.drawImage(img,0,0,c.width,c.height);};img.src=src;}
    let drawing=false,last=null;
    function pos(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*(c.width/b.width),y:(e.clientY-b.top)*(c.height/b.height)};}
    c.addEventListener('pointerdown',function(e){e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;last=pos(e);});
    c.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();const p=pos(e);
      x.strokeStyle='#16233a';x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';
      x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;});
    ['pointerup','pointercancel'].forEach(ev=>c.addEventListener(ev,function(){if(!drawing)return;drawing=false;storeSig(k,c);}));
  });
}
function storeSig(k,c){const L=LG();L['sig'+k]=c.toDataURL('image/png');
  const d=new Date(),p=n=>String(n).padStart(2,'0');L.sigDate=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  saveSt();
  const box=c.closest('.signbox');if(box){box.classList.add('sigdone');const ch=box.querySelector('.chip');if(ch){ch.className='chip done';ch.textContent='서명 완료';}}}
function clearSig(k){const c=document.getElementById('pad'+k);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);
  const L=LG();delete L['sig'+k];saveSt();renderLog();}

  document.getElementById('hTitle').textContent='관리자 · 브랜드 체크리스트 템플릿';
  let h='<div class="note-i">여기서 수정한 브랜드/단계/항목은 <b>모든 교육생 체크리스트에 즉시 적용</b>됩니다. (진행 중 체크 상태는 항목명이 같으면 유지)</div>'+
    '<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">'+
    '<button class="btn go" onclick="show(\'setup\')">✅ 완료·나가기</button>'+
    '<button class="btn" onclick="addBrand()">+ 브랜드 추가</button>'+
    '<button class="btn" onclick="exportTpl()">템플릿 백업</button>'+
    '<button class="btn" onclick="pickImp(\'tpl\')">템플릿 불러오기</button>'+
    '<button class="btn warn" onclick="resetTpl()">기본값 복원</button></div>';
  TPL.brands.forEach((b,bi)=>{
    h+='<div class="admin-brand"><div class="bh"><span class="ce" contenteditable="true" onblur="tplBrand('+bi+',this.textContent)">'+esc(b.name)+'</span>'+
      '<span class="sp" style="flex:1"></span><button class="btn" onclick="addSec('+bi+')">+ 단계</button> <span class="del" onclick="delBrand('+bi+')">✕ 브랜드삭제</span></div>';
    b.secs.forEach((s,si)=>{h+='<div class="admin-sec"><div class="sh"><span class="ce" contenteditable="true" onblur="tplSec('+bi+','+si+',this.textContent)">'+esc(s.name)+'</span>'+
      '<button class="btn" style="padding:3px 8px;font-size:11px" onclick="addTItem('+bi+','+si+')">+ 항목</button> <span class="del" onclick="delSec('+bi+','+si+')">✕</span></div>';
      s.items.forEach((it,ii)=>{h+='<div class="admin-item"><span class="ce" contenteditable="true" style="flex:1" onblur="tplItem('+bi+','+si+','+ii+',this.textContent)">'+esc(it)+'</span><span class="del" onclick="delTItem('+bi+','+si+','+ii+')">✕</span></div>';});
      h+='</div>';});
    h+='</div>';});
  document.getElementById('app').innerHTML=h;
}
function tplBrand(bi,v){TPL.brands[bi].name=v.trim();saveTpl();}
function tplSec(bi,si,v){TPL.brands[bi].secs[si].name=v.trim();saveTpl();}
function tplItem(bi,si,ii,v){TPL.brands[bi].secs[si].items[ii]=v.trim();saveTpl();}
function addBrand(){TPL.brands.push({name:'새 브랜드',secs:[{name:'1. 새 단계',items:['새 항목']}]});saveTpl();renderAdmin();}
function delBrand(bi){if(!confirm('브랜드를 삭제할까요?'))return;const nm=TPL.brands[bi].name;TPL.brands.splice(bi,1);ST.selected=ST.selected.filter(x=>x!==nm);saveTpl();saveSt();renderAdmin();}
function addSec(bi){TPL.brands[bi].secs.push({name:'새 단계',items:['새 항목']});saveTpl();renderAdmin();}
function delSec(bi,si){TPL.brands[bi].secs.splice(si,1);saveTpl();renderAdmin();}
function addTItem(bi,si){TPL.brands[bi].secs[si].items.push('새 항목');saveTpl();renderAdmin();}
function delTItem(bi,si,ii){TPL.brands[bi].secs[si].items.splice(ii,1);saveTpl();renderAdmin();}
function resetTpl(){if(!confirm('브랜드 템플릿을 기본값으로 복원할까요? (체크 기록은 유지)'))return;TPL=JSON.parse(JSON.stringify(DEF_TPL));TPL.v=3;saveTpl();renderAdmin();}

function exportSt(){const nm=(ST.store||'매장')+'_'+(ST.info.name||'교육생');dl(ST,'조리교육_'+nm+'.json');}
function exportTpl(){dl(TPL,'조리교육_브랜드템플릿.json');}
function dl(obj,name){const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
let impMode='st';
function pickImp(m){impMode=m;document.getElementById('imp').click();}
document.getElementById('imp').onchange=function(){const f=this.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(impMode==='tpl'){if(!d.brands)throw 0;TPL=d;saveTpl();renderAdmin();alert('템플릿을 불러와 전체에 적용했습니다.');}
    else{if(!d.checks)throw 0;ST=d;saveSt();render();alert('교육생 기록을 불러왔습니다.');}
  }catch(x){alert('파일 형식 오류');}};r.readAsText(f);this.value='';};
render();
if(syncOn()&&ST.store)pullSync(true);
window.addEventListener('beforeunload',function(){if(syncOn()&&SY.timer){clearTimeout(SY.timer);pushSync(false);}});
</script></body></html>
