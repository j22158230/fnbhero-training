<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>조리교육 통합관리 · 커리큘럼/체크리스트/교육일지</title>
<style>
:root{--navy:#1f3864;--blue:#2f5496;--line:#dcdfe6;--bg:#f4f6f9;--ok:#1f7a44;--warn:#c0392b;--mut:#6b7280;--gold:#b8860b}
*{box-sizing:border-box}
body{margin:0;font-family:"맑은 고딕","Malgun Gothic",sans-serif;background:var(--bg);color:#1d2733;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:700}
.sp{flex:1}
.btn{background:#fff;color:var(--navy);border:1px solid #c9d3e0;border-radius:6px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:#fff;border-color:#5a73a8}.btn.ghost:hover{background:#2a4575}
.btn.gold{background:var(--gold);color:#fff;border:none}
.btn.go{background:var(--ok);color:#fff;border:none;padding:9px 18px;font-size:14px}
.btn.warn{background:#fbeaea;color:var(--warn);border-color:#e3b7b3}
.wrap{padding:18px;max-width:1080px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h2{margin:0 0 4px;font-size:18px;color:var(--navy)}
.card .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
label.f{display:block;font-size:12.5px;color:#33415c;font-weight:700;margin:12px 0 5px}
input,select{font-family:inherit;font-size:14px;border:1px solid #c9d3e0;border-radius:7px;padding:8px 10px}
input.w{width:100%;max-width:340px}
.brandpick{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.bp{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700;color:#444;min-width:150px;display:flex;align-items:center;gap:9px;background:#fff}
.bp.on{border-color:var(--navy);background:#eef2fb;color:var(--navy)}
.bp input{width:18px;height:18px;accent-color:var(--navy)}
.bp .m{font-size:11px;color:var(--mut);font-weight:500}
.overall{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.bar{height:12px;background:#eef0f4;border-radius:8px;overflow:hidden}.bar > i{display:block;height:100%;background:linear-gradient(90deg,#2f5496,#1f7a44);width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#fff;border:1.5px solid var(--line);color:#555;border-radius:22px;padding:9px 18px;font-weight:700;cursor:pointer;font-size:14px}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.tab .p{font-size:11px;opacity:.85;margin-left:6px}
.metabar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.metabar b{color:var(--navy)}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.sec h3{margin:0;background:#eef2f8;color:var(--navy);font-size:14px;padding:9px 14px;display:flex;align-items:center;gap:8px}
.sec h3 .c{flex:1}.sec h3 .cnt{font-size:12px;color:var(--mut);font-weight:600}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid #eef0f4;padding:7px 10px;text-align:center}
th{background:#f7faff;color:#33415c;font-weight:700;font-size:12px}
td.t,th.t{text-align:left}td.t{font-weight:600}
tr.done td{background:#f2faf5}
.ck{width:20px;height:20px;cursor:pointer;accent-color:#1f7a44}
.note{width:96%;border:1px solid #e3e9f3;border-radius:5px;padding:4px 6px;font-size:12px}
.del{color:var(--warn);cursor:pointer;font-weight:700}
.ce[contenteditable="true"]{outline:1px dashed #c9d3e0;border-radius:4px;padding:1px 4px}
.ce[contenteditable="true"]:focus{outline:2px solid var(--gold);background:#fffdf5}
.mut{color:var(--mut);font-size:12px}
.note-i{background:#fff8e6;border:1px solid #f1e2b6;color:#7a5b00;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.admin-brand{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.admin-brand > .bh{background:var(--navy);color:#fff;padding:8px 14px;display:flex;gap:8px;align-items:center;font-weight:700}
.admin-brand .bh .ce{color:#fff}
.admin-sec{padding:8px 14px;border-bottom:1px solid #f0f0f0}
.admin-sec .sh{font-weight:700;color:var(--navy);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.admin-item{display:flex;gap:8px;align-items:center;padding:2px 0 2px 14px;font-size:13px}
.hide{display:none}
footer{padding:16px;text-align:center;color:var(--mut);font-size:12px}

/* 커리큘럼 */
.curr table{table-layout:fixed}
.curr th{font-size:12px}
.curr td{vertical-align:top;text-align:left;font-size:12.5px}
.curr td.tm{text-align:center;font-weight:700;color:var(--navy);white-space:nowrap;width:104px}
.curr td.md,.curr td.ow{text-align:center;width:88px;color:#4a5568}
.curr .ce[contenteditable="true"]{display:block;min-height:20px}
.daymeta{background:#eef2fb;border:1px solid #d6e0f5;border-radius:9px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.daymeta b{color:var(--navy)}
.goal{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.65}

/* 교육일지 */
.logform label.f{margin-top:14px}
textarea{font-family:inherit;font-size:13.5px;border:1px solid #c9d3e0;border-radius:7px;padding:9px 11px;width:100%;line-height:1.6;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.prog-inline{background:#f7faff;border:1px solid #dfe7f5;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:6px}
.prog-inline .row{display:flex;justify-content:space-between;padding:3px 0}
.signwrap{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.signbox{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;flex:1;min-width:270px}
.signbox .lbl{font-size:12.5px;font-weight:700;color:#33415c;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.signbox .lbl .sp{flex:1}
.sigpad{border:1px dashed #bcc7d8;border-radius:7px;background:#fcfdff;touch-action:none;display:block;width:100%;height:110px;cursor:crosshair}
.sigmeta{font-size:11.5px;color:var(--mut);margin-top:5px}
.sigdone{border-color:var(--ok);background:#f7fdf9}
.chip{display:inline-block;background:#eef2fb;color:var(--navy);border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:700}
.chip.done{background:#e8f6ee;color:var(--ok)}

/* ══════ 모바일 최적화 ══════ */
@media(max-width:760px){
  header{padding:10px 12px;gap:7px}
  header h1{font-size:16px}
  header .btn{padding:5px 10px;font-size:12px}
  .savebar{font-size:11px;padding:3px 9px}
  .wrap{padding:12px 10px 40px}
  .card{padding:14px 13px}
  .metabar{gap:7px;font-size:12px}
  .metabar .btn{padding:5px 10px;font-size:12px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .tab{white-space:nowrap;flex:none}
  .vbox{gap:8px}
  .vcard{min-width:calc(50% - 4px);padding:9px 11px}
  .vcard .v{font-size:16px}
  input,select,textarea{font-size:16px}   /* iOS 자동 확대 방지 */

  /* 체크리스트·커리큘럼 표 → 카드형 */
  .sec table,.sec tbody,.sec tr,.sec td{display:block;width:auto}
  .sec thead{display:none}
  .sec tr{padding:12px 13px;border-bottom:1px solid var(--line)}
  .sec tr:last-child{border-bottom:none}
  .sec td{border:none!important;padding:5px 0;text-align:left!important;
    display:flex;align-items:center;justify-content:space-between;gap:12px;width:auto!important}
  .sec td::before{content:attr(data-l);font-size:12px;font-weight:700;color:#5a6678;flex:none}
  .sec td:not([data-l])::before{content:none}
  .sec td.t{display:block;font-size:14px;font-weight:700;color:var(--navy);
    line-height:1.45;padding-bottom:8px;word-break:keep-all}
  .sec td.t::before{content:none}
  .sec td.tm{justify-content:flex-start;gap:8px}
  .sec select.lvsel{width:auto;min-width:132px;flex:none}
  .sec input.note{width:62%;flex:none}
  .stdbtn{margin-left:6px;white-space:nowrap;padding:2px 9px;font-size:11px}
  tr.done,tr.warnrow{border-left:4px solid transparent}
  .sec tr.done{border-left-color:var(--ok);background:#f7fdf9}
  .sec tr.warnrow{border-left-color:var(--gold)}

  /* 그 외 표는 가로 스크롤 */
  .card table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  .card table td.t,.card table th.t{white-space:normal;min-width:150px}

  .signbox{min-width:100%}
  .stdrow{flex-wrap:wrap;gap:5px}
  .stdrow label{width:100%}
  .stdrow input{width:100%;flex:auto}
  .admin-item{flex-wrap:wrap;gap:6px}
  .mdl{padding:16px 15px;max-height:82vh;overflow-y:auto}
  .mdl .ft{justify-content:stretch}
  .mdl .ft .btn{flex:1;text-align:center}
}
@media print{
  header,footer,.metabar,.tabs .p,.del,.note-i{display:none!important}
  body{background:#fff;font-size:11.5px}
  .wrap{padding:0;max-width:none}
  .tab{display:none}.tab.on{display:inline-block}
  .sec,.signbox,.card{break-inside:avoid}
  .btn{display:none!important}
  textarea,input{border:none;border-bottom:1px solid #bbb;border-radius:0;padding:2px 0}
  textarea{resize:none;overflow:visible;height:auto}
  .sigpad{border:1px solid #999}
  .prn-only{display:block!important}
}
.prn-only{display:none}
.syncbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px}
.sdot{width:9px;height:9px;border-radius:50%;background:#c4ccd8;display:inline-block}
.sdot.on{background:#1f7a44}.sdot.err{background:#c0392b}.sdot.wait{background:#b8860b}
/* 평가 */
.savebar{font-size:12px;padding:4px 11px;border-radius:20px;cursor:pointer;font-weight:700;white-space:nowrap;
  background:rgba(255,255,255,.14);color:#cdd8ec;border:1px solid rgba(255,255,255,.22)}
.savebar.dirty{background:#b8860b;color:#fff;border-color:#b8860b}
.savebar.saving{background:#4b6ea9;color:#fff;border-color:#4b6ea9}
.savebar.saved{background:#1f7a44;color:#fff;border-color:#1f7a44}
.savebar.error,.savebar.keychg{background:#c0392b;color:#fff;border-color:#c0392b}
.ovl{position:fixed;inset:0;background:rgba(16,24,40,.55);display:flex;align-items:center;justify-content:center;z-index:900;padding:18px}
.mdl{background:#fff;border-radius:13px;max-width:520px;width:100%;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.mdl h3{margin:0 0 8px;font-size:17px;color:var(--navy)}
.mdl .bd{font-size:13.5px;line-height:1.7;color:#33415c}
.mdl .ft{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.warnbar{background:#fbeaea;border:1px solid #e3b7b3;color:#8e2c22;border-radius:9px;padding:11px 14px;font-size:13px;line-height:1.65;margin-bottom:12px}
.warnbar b{font-weight:700}
.stdbtn{display:inline-block;margin-left:7px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:4px;
  border:1px solid #c9d3e0;color:#8a94a6;background:#fff;cursor:pointer;vertical-align:1px}
.stdbtn.has{border-color:#1f7a44;color:#1f7a44;background:#f0faf4}
.stdbtn:hover{background:#eef2fb}
.btn.stdedit{padding:3px 9px;font-size:11px}
.btn.stdedit.on{border-color:#1f7a44;color:#1f7a44;background:#f0faf4}
.stdbox{display:none;padding:8px 10px 10px 26px;background:#f7faff;border-left:3px solid #b8860b}
.stdbox.open{display:block}
.stdrow{display:flex;align-items:center;gap:9px;margin-top:6px}
.stdrow label{width:100px;font-size:11.5px;font-weight:700;color:#33415c;flex:none}
.stdrow input{flex:1;font-size:12.5px;padding:5px 9px;border:1px solid #c9d3e0;border-radius:6px}
label.reqchk{font-size:11.5px;color:#8e2c22;font-weight:700;display:flex;align-items:center;gap:3px;white-space:nowrap}
select.minsel{font-size:11.5px;padding:3px 5px;border:1px solid #c9d3e0;border-radius:5px;background:#fff}
.req{display:inline-block;background:#8e2c22;color:#fff;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:700;vertical-align:1px}
.gapbadge{display:inline-block;background:#fff3d9;color:#8a6100;border:1px solid #e6cf9a;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:700;margin-left:6px}
.hist{font-size:11px;color:#8a94a6;margin-top:3px}
select.lvsel{width:100%;font-size:12px;padding:5px 4px;border:1px solid #c9d3e0;border-radius:6px;background:#fff}
select.lvsel.lv1{border-color:#c0392b;color:#8e2c22;font-weight:700}
select.lvsel.lv2{border-color:#b8860b;color:#8a6100;font-weight:700}
select.lvsel.lv3{border-color:#1f7a44;color:#1f7a44}
select.lvsel.lv4{border-color:#1f7a44;background:#f0faf4;color:#1f7a44;font-weight:700}
tr.warnrow{background:#fdf6ec}
.vbox{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.vcard{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px}
.vcard .k{font-size:11.5px;color:var(--mut)}
.vcard .v{font-size:19px;font-weight:700;color:var(--navy);margin-top:2px}
.verd{display:inline-block;border-radius:20px;padding:4px 14px;font-size:13px;font-weight:700}
.verd.ok{background:#e8f6ee;color:#1f7a44}
.verd.cond{background:#fff3d9;color:#8a6100}
.verd.ng{background:#fbeaea;color:#8e2c22}
.verd.none{background:#eef0f4;color:#6b7480}
.weak{background:#fdf6ec;border:1px solid #e6cf9a;border-radius:9px;padding:11px 14px;margin-top:12px;font-size:12.5px;line-height:1.7}
.weak b{color:#8a6100}
.weak ul{margin:6px 0 0;padding-left:18px}
table.board td{text-align:center;font-size:12.5px;vertical-align:middle}
table.board td.t{text-align:left}
tr.brow{cursor:pointer}
tr.brow:hover{background:#f2f6fd}
tr.brow.bad{background:#fbfafa;color:#8a94a6}
.syncmsg{display:none;margin-top:10px;padding:10px 13px;border-radius:8px;font-size:12.5px;line-height:1.6;border:1px solid #dfe7f5;background:#f7faff;color:#33415c}
.syncmsg.err{border-color:#e3b7b3;background:#fbeaea;color:#8e2c22}
.syncmsg.ok{border-color:#bfe3cd;background:#f0faf4;color:#1f7a44}
.syncnote{background:#f7faff;border:1px solid #dfe7f5;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#33415c;line-height:1.65;margin-top:10px}
</style></head><body>
<header>
  <h1 id="hTitle">조리교육 통합관리</h1>
  <span id="save" style="font-size:12px;color:#cdd8ec"></span>

  <span class="sp"></span>
  <button class="btn ghost" id="navBoard" onclick="show('board')">전체 현황</button>
  <button class="btn ghost" id="navCurr" onclick="show('curr')">커리큘럼</button>
  <button class="btn ghost" id="navList" onclick="show('list')">체크리스트</button>
  <button class="btn ghost" id="navLog" onclick="show('log')">교육일지</button>
  <button class="btn ghost" id="navFu" onclick="show('fu')">사후점검</button>

const DEF_ST={view:'setup',store:'',info:{name:'',start:'',mgr:''},selected:[],active:0,checks:{},logs:{},dayActive:0,confirmed:false,syncKey:''};
const MEM={};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return MEM[k]||null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;}}
let TPL=loadTpl(), ST=loadSt();
function loadTpl(){try{const t=JSON.parse(lsGet(LS_TPL));if(t&&t.brands){
  if(!t.curriculum||!t.curriculum.length||!t.v||t.v<3)t.curriculum=JSON.parse(JSON.stringify(DEF_TPL.curriculum));
  if(!t.v||t.v<3){const nb=DEF_TPL.brands.find(b=>b.name==='공통 운영 · 발주/재고');
    if(nb&&!t.brands.some(b=>b.name===nb.name))t.brands.push(JSON.parse(JSON.stringify(nb)));t.v=3;}
  return t;}}catch(e){}
  const d=JSON.parse(JSON.stringify(DEF_TPL));d.v=3;return d;}
function loadSt(){try{const s=JSON.parse(lsGet(LS_ST));if(s&&s.checks){if(!s.logs)s.logs={};if(s.dayActive==null)s.dayActive=0;
    if(s.confirmed==null){s.confirmed=!!(s.store&&s.info&&s.info.start&&s.selected&&s.selected.length);s.syncKey=s.confirmed?((s.store)+'_'+(s.info.start)).replace(/[^\wㄱ-ㅎ가-힣.-]/g,'_').slice(0,80):'';}
    return s;}}catch(e){}return JSON.parse(JSON.stringify(DEF_ST));}
/* 화면 이동·탭 전환은 로컬만 기록하고 서버로 보내지 않습니다 */
function saveLocal(){lsSet(LS_ST,JSON.stringify(ST));}
function saveTpl(){lsSet(LS_TPL,JSON.stringify(TPL));toast();markDirty();}
function saveSt(){lsSet(LS_ST,JSON.stringify(ST));toast();markDirty();}
function markDirty(){if(!pushable()){paintSave();return;}SY.dirty=true;paintSave('dirty');schedulePush();}

/* ══════════ 서버 동기화 ══════════ */
const LS_SY='fnbhero_sync_cfg_v1';
let SY={url:'',code:'',by:'',rev:0,timer:null,retry:null,busy:false,dirty:false,state:'off',lastSaved:''};
(function(){try{const c=JSON.parse(lsGet(LS_SY));if(c)SY=Object.assign(SY,c,{timer:null,retry:null,busy:false,dirty:false,state:'off',lastSaved:''});}catch(e){}})();
function saveSy(){lsSet(LS_SY,JSON.stringify({url:SY.url,code:SY.code,by:SY.by,rev:SY.rev}));}
function syncOn(){return !!(SY.url&&SY.code);}
function keyReady(){return !!(ST.store&&ST.info.start&&ST.selected.length);}
function keyChanged(){return !!(ST.confirmed&&ST.syncKey&&ST.syncKey!==syncKey());}
function pushable(){return syncOn()&&ST.confirmed&&keyReady()&&!keyChanged();}
function hasContent(){return Object.keys(ST.checks||{}).length>0||Object.keys(ST.logs||{}).length>0;}

/* 저장 상태 표시 */
function paintSave(state){
  const el=document.getElementById('savebar');if(!el)return;
  if(state)SY.state=state;
  let s=SY.state,txt,cls;
  if(keyChanged()){s='keychg';}
  else if(!syncOn()||!ST.confirmed)s='off';
  switch(s){
    case 'dirty': txt=((window.innerWidth||1024)<760?'저장 대기 · 누르면 저장':'저장 대기 · 눌러서 지금 저장');cls='dirty';break;
    case 'saving':txt='저장 중…';cls='saving';break;
    case 'saved': {const nar=(window.innerWidth||1024)<760;
      txt='저장됨 · '+(nar?String(SY.lastSaved||'').slice(11):(SY.lastSaved||''));cls='saved';break;}
    case 'error': txt='저장 안 됨 · 눌러서 재시도';cls='error';break;
    case 'keychg':txt='자동 저장 중단 · 교육 정보 변경됨';cls='keychg';break;
    default:      txt=syncOn()?(ST.confirmed?'대기':'이 기기에만 저장'):'이 기기에만 저장';cls='';}
  el.textContent=txt;el.className='savebar '+cls;SY.state=s;}
function saveNow(){
  if(keyChanged()){show('setup');return;}
  if(!syncOn()){alert('동기화 주소와 접속 코드가 설정되지 않았습니다.');show('setup');return;}
  if(!ST.confirmed){alert('설정 화면에서 [교육 시작]을 눌러 교육 정보를 확정해 주십시오.');show('setup');return;}
  clearTimeout(SY.timer);pushSync(false);}

/* 되돌리기용 스냅샷 — 기기에 최대 5개 */
const LS_SNAP='fnbhero_snap_v1';
function snapList(){try{return JSON.parse(lsGet(LS_SNAP))||[];}catch(e){return [];}}
function snapshot(tag){try{
  const a=snapList();
  a.push({at:new Date().toISOString(),tag:tag||'',key:syncKey(),store:ST.store,st:JSON.parse(JSON.stringify(ST))});
  while(a.length>5)a.shift();
  lsSet(LS_SNAP,JSON.stringify(a));}catch(e){}}
function restoreSnap(i){const a=snapList(),o=a[i];if(!o)return;
  modal('되돌리기 확인',
    '<b>'+esc(o.store||o.key)+'</b><br>'+fmtTime(o.at)+' 시점 상태로 되돌립니다.<br><br>현재 화면의 내용은 사라집니다. 되돌린 뒤 [지금 저장]을 눌러야 서버에도 반영됩니다.',
    [{t:'되돌리기',c:'warn',f:function(){snapshot('되돌리기 직전');ST=o.st;saveLocal();paintSave('dirty');render();}},
     {t:'취소'}]);}

/* 모달 — 취소는 아무 동작도 하지 않습니다 */
function modal(title,body,btns){
  const o=document.createElement('div');o.className='ovl';
  let h='<div class="mdl"><h3>'+title+'</h3><div class="bd">'+body+'</div><div class="ft">';
  btns.forEach((b,i)=>{h+='<button class="btn '+(b.c||'')+'" data-i="'+i+'">'+b.t+'</button>';});
  o.innerHTML=h+'</div></div>';
  o.addEventListener('click',function(e){
    const t=e.target.closest('button[data-i]');
    if(!t){if(e.target===o)o.remove();return;}
    const b=btns[+t.dataset.i];o.remove();if(b.f)b.f();});
  document.body.appendChild(o);}
function syncKey(){const k=(ST.store||'매장')+'_'+(ST.info.start||'날짜미정');
  return k.replace(/[^\wㄱ-ㅎ가-힣.-]/g,'_').slice(0,80);}
function syncSt(state,msg){const el=null;
  document.querySelectorAll('.sdot').forEach(d=>{d.className='sdot'+(state?' '+state:'');});
  const plain=String(msg||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').trim();
  const lb=document.getElementById('syncLabel');if(lb&&plain)lb.textContent=plain.length>46?plain.slice(0,46)+'…':plain;
  if(el)el.textContent=plain?'· '+(plain.length>28?plain.slice(0,28)+'…':plain):'';
  const m=document.getElementById('syncMsg');
  if(m){m.innerHTML=msg||'';m.className='syncmsg'+(state==='err'?' err':state==='on'?' ok':'');m.style.display=msg?'block':'none';}}
function schedulePush(){if(!syncOn())return;clearTimeout(SY.timer);SY.timer=setTimeout(()=>pushSync(false),2500);}

/* 통신 계층 — 실패 원인을 구분해 돌려줍니다 */
function syncReq(opt){
  var url=(SY.url||'').trim().replace(/\s+/g,'');
  if(!/^https:\/\//i.test(url))
    return Promise.resolve({ok:false,err:'주소가 <b>https://</b> 로 시작하지 않습니다. Apps Script 배포 화면의 웹 앱 URL을 그대로 붙여넣으십시오.'});
  if(/\/dev$/.test(url))
    return Promise.resolve({ok:false,err:'주소가 <b>/dev</b> 로 끝납니다. 이 주소는 본인 계정 로그인 상태에서만 열립니다. 배포 화면의 <b>/exec</b> 주소를 사용하십시오.'});
  if(!/\/exec$/.test(url))
    return Promise.resolve({ok:false,err:'주소가 <b>/exec</b> 로 끝나야 합니다. 현재 입력값을 확인하십시오.'});
  var req=opt.post
    ? fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(opt.post),redirect:'follow'})
    : fetch(url+'?'+opt.get,{method:'GET',redirect:'follow'});
  return req.then(function(r){return r.text().then(function(t){return{status:r.status,text:t};});})
   .then(function(res){
     var t=(res.text||'').trim();
     if(res.status>=400)
       return{ok:false,err:'서버가 오류를 반환했습니다 (HTTP '+res.status+'). 배포가 완료되었는지, 주소가 최신 배포의 것인지 확인하십시오.'};
     if(t.charAt(0)!=='{'){
       if(/accounts\.google\.com|ServiceLogin|signin\/v2|계정에 로그인/i.test(t))
         return{ok:false,err:'로그인 화면이 돌아왔습니다. Apps Script <b>배포 → 배포 관리 → 수정</b>에서 <b>액세스 권한이 있는 사용자</b>를 <b>모든 사용자</b>로 바꾸고, 버전을 <b>새 버전</b>으로 지정해 다시 배포하십시오.'};
       if(/Script function not found|스크립트 함수를 찾을 수 없/i.test(t))
         return{ok:false,err:'스크립트에 doGet 또는 doPost 함수가 없습니다. Code.gs 내용을 다시 붙여넣고 저장한 뒤 새 버전으로 재배포하십시오.'};
       if(/authorization|권한|승인이 필요/i.test(t))
         return{ok:false,err:'스크립트 권한 승인이 완료되지 않았습니다. Apps Script 편집기에서 doGet 함수를 한 번 실행해 권한을 허용한 뒤 재배포하십시오.'};
       return{ok:false,err:'JSON이 아닌 응답을 받았습니다. 웹 앱 주소가 올바른지 확인하십시오. 브라우저 주소창에 해당 URL을 직접 열어보면 원인을 확인할 수 있습니다.'};
     }
     try{return{ok:true,data:JSON.parse(t)};}catch(x){return{ok:false,err:'응답 내용을 해석하지 못했습니다.'};}
   })
   .catch(function(e){

function pushSync(force){

    SY.busy=false;

        '<span class="mut">닫기를 누르면 아무것도 바뀌지 않습니다. 이 기기의 내용은 그대로 남습니다.</span>',

            if(d.st&&d.st.checks){ST=d.st;lsSet(LS_ST,JSON.stringify(ST));}
            SY.rev=d.rev||0;saveSy();SY.dirty=false;paintSave('saved');
            SY.lastSaved=fmtTime(d.updated);syncSt('on','서버 기록을 적용했습니다.');render();}},
         {t:'이 기기 내용으로 덮어쓰기',c:'warn',f:function(){
            modal('덮어쓰기 확인',
              '서버의 '+fmtTime(d.updated)+' 기록이 이 기기 내용으로 대체됩니다.<br>'+
              '서버에는 직전 버전 1개가 남아 복구할 수 있습니다.',
              [{t:'덮어쓰기 실행',c:'warn',f:function(){snapshot('덮어쓰기 직전');pushSync(true);}},{t:'취소'}]);}},
         {t:'닫기'}]);
      return;}
    if(d.empty){paintSave('error');
      modal('빈 내용으로 덮어쓸 수 없습니다',
        '서버에는 기록이 있는데 이 기기에는 평가·일지 내용이 없습니다.<br>'+
        '먼저 [서버에서 불러오기]로 기존 기록을 받아 오십시오.',
        [{t:'서버에서 불러오기',c:'go',f:function(){pullSync(false);}},{t:'닫기'}]);
      return;}
    if(!d.ok){paintSave('error');syncSt('err','저장 실패: '+esc(d.error||''));retryLater();return;}
    SY.rev=d.rev;saveSy();SY.dirty=false;SY.lastSaved=fmtTime(d.updated);
    snapshot('저장 시점');paintSave('saved');syncSt('on','저장됨 · '+fmtTime(d.updated));
  });
}

function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function K(b,s,it){return b+'¦'+s+'¦'+it;}
/* ── 4단계 평가 모델 ─────────────────────────
   1 미습득 / 2 보조 필요 / 3 단독 가능 / 4 숙련
   self = 교육생 자기평가, mgr = 담당자 평가, 0 = 미평가 */
const LV=['미평가','1 미습득','2 보조 필요','3 단독 가능','4 숙련'];
const LVS=['-','1','2','3','4'];
function chk(b,s,it){const c=ST.checks[K(b,s,it)];
  if(!c)return{self:0,mgr:0,note:'',hist:[]};
  if(c.self===undefined){ // 구버전(교육/실습/평가 체크) 자동 환산
    return{self:0,mgr:c.pass?3:(c.prac?2:(c.edu?1:0)),note:c.note||'',hist:[]};}
  return{self:c.self||0,mgr:c.mgr||0,note:c.note||'',hist:c.hist||[]};}
function selBrands(){return TPL.brands.filter(b=>ST.selected.includes(b.name));}
/* 항목별 기준 — 관리자에서 수정 */
function RULES(){if(!TPL.rules)TPL.rules={};return TPL.rules;}
function rule(b,s,it){const r=RULES()[K(b,s,it)];
  return{req:r?!!r.req:false, min:(r&&r.min)?r.min:(TPL.pass&&TPL.pass.defMin?TPL.pass.defMin:3)};}
function setRule(b,s,it,k,v){const key=K(b,s,it);const r=RULES()[key]||{};r[k]=v;RULES()[key]=r;saveTpl();}
function PASSCFG(){if(!TPL.pass)TPL.pass={defMin:3,avg:3.0,useAvg:true};
  if(TPL.pass.defMin==null)TPL.pass.defMin=3;if(TPL.pass.avg==null)TPL.pass.avg=3.0;
  if(TPL.pass.useAvg==null)TPL.pass.useAvg=true;return TPL.pass;}
/* 브랜드 진행 상황 — 기준 충족률과 평균 점수 */
function bProg(b){let t=0,p=0,sum=0,scored=0,reqT=0,reqOk=0;
  b.secs.forEach(s=>s.items.forEach(it=>{t++;
    const c=chk(b.name,s.name,it),r=rule(b.name,s.name,it);
    if(c.mgr>0){sum+=c.mgr;scored++;}
    if(c.mgr>=r.min)p++;
    if(r.req){reqT++;if(c.mgr>=r.min)reqOk++;}}));
  return{t,p,pc:t?Math.round(p/t*100):0,avg:scored?sum/scored:0,scored,reqT,reqOk};}
/* 익일 보완 과제 대상 — 2점 이하 또는 자기평가와 2점 이상 격차 */
function weakItems(){const out=[];
  selBrands().forEach(b=>b.secs.forEach(s=>s.items.forEach(it=>{
    const c=chk(b.name,s.name,it);if(!c.mgr)return;
    const gap=(c.self&&Math.abs(c.self-c.mgr)>=2);
    if(c.mgr<=2||gap)out.push({b:b.name,s:s.name,it,self:c.self,mgr:c.mgr,gap,note:c.note});})));
  return out;}
/* 수료 판정 */
function verdict(){
  const bs=selBrands();let t=0,p=0,sum=0,scored=0,reqT=0,reqNg=[];
  bs.forEach(b=>b.secs.forEach(s=>s.items.forEach(it=>{t++;
    const c=chk(b.name,s.name,it),r=rule(b.name,s.name,it);
    if(c.mgr>0){sum+=c.mgr;scored++;}
    if(c.mgr>=r.min)p++;
    if(r.req){reqT++;if(c.mgr<r.min)reqNg.push({b:b.name,s:s.name,it,mgr:c.mgr,min:r.min});}})));
  const avg=scored?sum/scored:0,cfg=PASSCFG();
  const low=[];bs.forEach(b=>b.secs.forEach(s=>s.items.forEach(it=>{
    const c=chk(b.name,s.name,it),r=rule(b.name,s.name,it);
    if(c.mgr>0&&c.mgr<r.min)low.push({b:b.name,s:s.name,it,mgr:c.mgr,min:r.min});})));
  let res,cls;
  if(!scored){res='평가 미실시';cls='none';}
  else if(reqNg.length){res='미수료';cls='ng';}
  else if(cfg.useAvg&&avg<cfg.avg){res='조건부 수료';cls='cond';}
  else if(low.length){res='조건부 수료';cls='cond';}
  else res='수료',cls='ok';
  return{res,cls,t,p,avg,scored,reqT,reqNg,low,unscored:t-scored};}

    [{t:'확정하고 시작',c:'go',f:function(){
ST.confirmed=true;ST.syncKey=key;saveLocal();

/* 확정 직후 서버에 같은 키의 기존 기록이 있으면 먼저 확인합니다 */
function pullThenStart(){
  paintSave('saving');
  syncReq({get:'action=load&code='+encodeURIComponent(SY.code)+'&key='+encodeURIComponent(syncKey())}).then(function(r){
    if(!r.ok||!r.data.ok){paintSave('error');show('curr');return;}
    const d=r.data;
    if(!d.found){SY.rev=0;saveSy();paintSave('dirty');markDirty();show('curr');return;}
    modal('서버에 같은 교육 기록이 있습니다',
      '최종 저장 '+fmtTime(d.updated)+(d.by?' · '+esc(d.by):'')+
      '<br><br>서버 기록을 불러와 이어서 작성하시겠습니까? 현재 이 기기의 내용은 사라집니다.',
      [{t:'서버 기록 불러오기',c:'go',f:function(){
         snapshot('불러오기 직전');
         if(d.tpl&&d.tpl.brands){TPL=d.tpl;lsSet(LS_TPL,JSON.stringify(TPL));}
         if(d.st&&d.st.checks){ST=d.st;ST.confirmed=true;ST.syncKey=syncKey();lsSet(LS_ST,JSON.stringify(ST));}
         SY.rev=d.rev||0;saveSy();paintSave('saved');SY.lastSaved=fmtTime(d.updated);render();}},
       {t:'이 기기 내용 유지',f:function(){SY.rev=d.rev||0;saveSy();paintSave('dirty');show('curr');}}]);
  });}

function sel4(b,s,it,k,v,label){let o='';

function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function cssid(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return 'x'+h;}

function cur_(b,s,it){const key=K(b,s,it);const o=chk(b,s,it);

function fillFromCur(){const c=CUR()[ST.dayActive];if(!c)return;
  const txt=c.blocks.filter(b=>b.s&&b.s!=='중식').map(b=>'· ['+b.t+'] '+b.s+(b.d?' — '+b.d:'')).join('\n');

function initPads(){
  ['T','M'].forEach(k=>{
    const c=document.getElementById('pad'+k);if(!c)return;
    const r=c.getBoundingClientRect();c.width=Math.max(240,Math.round(r.width));c.height=110;
    const x=c.getContext('2d');
    const src=LG()['sig'+k];
    if(src){const img=new Image();img.onload=function(){x.drawImage(img,0,0,c.width,c.height);};img.src=src;}
    let drawing=false,last=null;
    function pos(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*(c.width/b.width),y:(e.clientY-b.top)*(c.height/b.height)};}
    c.addEventListener('pointerdown',function(e){e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;last=pos(e);});
    c.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();const p=pos(e);
      x.strokeStyle='#16233a';x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';
      x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;});
    ['pointerup','pointercancel'].forEach(ev=>c.addEventListener(ev,function(){if(!drawing)return;drawing=false;storeSig(k,c);}));
  });
}
function storeSig(k,c){const L=LG();L['sig'+k]=c.toDataURL('image/png');
  const d=new Date(),p=n=>String(n).padStart(2,'0');L.sigDate=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  saveSt();
  const box=c.closest('.signbox');if(box){box.classList.add('sigdone');const ch=box.querySelector('.chip');if(ch){ch.className='chip done';ch.textContent='서명 완료';}}}
function clearSig(k){const c=document.getElementById('pad'+k);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);
  const L=LG();delete L['sig'+k];saveSt();renderLog();}

function todayStr(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function dayDiff(a,b){const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');
  if(isNaN(x)||isNaN(y))return null;return Math.round((y-x)/86400000);}
function phase(f){
  if(!f.start)return{t:'날짜 미입력',c:'#8a94a6'};
  const n=dayDiff(f.start,todayStr());
  if(n===null)return{t:'-',c:'#8a94a6'};
  const days=f.days||7;
  if(n<0)return{t:'시작 전 (D'+n+')',c:'#8a94a6'};
  if(n>=days)return{t:'교육 종료',c:'#1f7a44'};
  return{t:'진행 중 · '+(n+1)+'일차',c:'#b8860b'};
}

function addDays(s,n){const d=new Date(s+'T00:00:00');if(isNaN(d))return '';

const FU_R=[7,14,30];
function FU(){if(!ST.fu)ST.fu={base:[],rounds:{}};if(!ST.fu.rounds)ST.fu.rounds={};return ST.fu;}
function fuRound(r){const f=FU();if(!f.rounds[r])f.rounds[r]={scores:{},note:'',by:'',done:false,at:''};
  if(!f.rounds[r].scores)f.rounds[r].scores={};return f.rounds[r];}
function fuDue(r){return ST.certDate?addDays(ST.certDate,r):'';}
/* 수료 확정 시점의 기준 미달·미평가 항목을 사후점검 대상으로 고정합니다 */
function fuInit(){
  const base=[];
  selBrands().forEach(b=>b.secs.forEach(s=>s.items.forEach(it=>{
    const c=chk(b.name,s.name,it),r=rule(b.name,s.name,it);
    if(c.mgr<r.min)base.push({k:K(b.name,s.name,it),b:b.name,s:s.name,it:it,min:r.min,mgr0:c.mgr,note:c.note||''});})));
  FU().base=base;return base;}
/* 해당 회차까지의 최신 점수 */
function fuScore(k,upto){
  let v=null;
  FU().base.forEach(x=>{if(x.k===k&&v===null)v=x.mgr0;});
  FU_R.forEach(r=>{if(r<=upto){const sc=fuRound(r).scores[k];if(sc)v=sc;}});
  return v===null?0:v;}
/* 이번 회차에서 점검할 항목 — 직전까지 기준 미달인 것 */
function fuTargets(r){const prev=FU_R.filter(x=>x<r).pop()||0;
  return FU().base.filter(x=>fuScore(x.k,prev)<x.min);}
function fuStatus(r){const rd=fuRound(r);
  if(rd.done)return{t:'완료',c:'ok'};
  const due=fuDue(r);if(!due)return{t:'예정일 미정',c:'none'};
  const n=dayDiff(todayStr(),due);
  if(n>0)return{t:'D-'+n,c:'none'};
  if(n===0)return{t:'오늘',c:'cond'};
  return{t:(-n)+'일 경과',c:'ng'};}
function fuRemain(){const last=FU_R[FU_R.length-1];
  return FU().base.filter(x=>fuScore(x.k,last)<x.min).length;}

    '<div class="sub">항목별 기준점과 필수 여부는 아래 목록에서 개별로 지정합니다. 여기서는 전체 기본값을 정합니다.</div>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end">'+
    '<div><label class="f">기본 기준점</label><select onchange="setPass(\'defMin\',+this.value)">'+
      [1,2,3,4].map(v=>'<option value="'+v+'"'+(cfg.defMin===v?' selected':'')+'>'+LV[v]+'</option>').join('')+'</select></div>'+
    '<div><label class="f">전체 평균 기준</label><select onchange="setPass(\'avg\',+this.value)">'+
      [2.0,2.5,3.0,3.5,4.0].map(v=>'<option value="'+v+'"'+(Math.abs(cfg.avg-v)<0.01?' selected':'')+'>'+v.toFixed(1)+'점 이상</option>').join('')+'</select></div>'+
    '<div><label class="f">평균 기준 적용</label><select onchange="setPass(\'useAvg\',this.value===\'1\')">'+
      '<option value="1"'+(cfg.useAvg?' selected':'')+'>적용</option><option value="0"'+(!cfg.useAvg?' selected':'')+'>미적용</option></select></div>'+
    '<div style="flex:1"></div>'+
    '<button class="btn" onclick="bulkReq(true)">전 항목 필수 지정</button>'+
    '<button class="btn" onclick="bulkReq(false)">전 항목 필수 해제</button></div>'+
    '<div class="syncnote">필수 항목이 하나라도 기준점 미만이면 <b>미수료</b>로 판정됩니다. 선택 항목만 미달이면 <b>조건부 수료</b>가 됩니다.</div></div>';
  const L=LVDEF(),sc=stdCount();
  h+='<div class="card"><h2>점수 판정 기준</h2>'+
    '<div class="sub">모든 항목에 공통으로 적용되는 4단계 정의입니다. 담당자가 바뀌어도 판정이 흔들리지 않도록 문구를 확정해 두십시오.</div>'+
    '<table><thead><tr><th style="width:70px">점수</th><th class="t">판정 기준</th></tr></thead><tbody>';
  [4,3,2,1].forEach(i=>{h+='<tr><td><b>'+i+'점</b></td><td class="t"><span class="ce" contenteditable="true" style="display:block" onblur="setLvDef('+i+',this.textContent)">'+esc(L[i])+'</span></td></tr>';});
  h+='</tbody></table>'+
    '<div class="syncnote">항목별 완성 기준(중량·시간·육안·불합격 기준)은 아래 목록에서 <b>기준</b> 버튼으로 입력합니다. '+
    '현재 <b>'+sc.w+'/'+sc.t+'개 ('+sc.pc+'%)</b> 작성되었습니다. 작성된 기준은 체크리스트와 수료 확인서에 함께 출력됩니다.</div></div>';
  TPL.brands.forEach((b,bi)=>{
    h+='<div class="admin-brand"><div class="bh"><span class="ce" contenteditable="true" onblur="tplBrand('+bi+',this.textContent)">'+esc(b.name)+'</span>'+
      '<span class="sp" style="flex:1"></span><button class="btn" onclick="addSec('+bi+')">+ 단계</button> <span class="del" onclick="delBrand('+bi+')">✕ 브랜드삭제</span></div>';
    b.secs.forEach((s,si)=>{h+='<div class="admin-sec"><div class="sh"><span class="ce" contenteditable="true" onblur="tplSec('+bi+','+si+',this.textContent)">'+esc(s.name)+'</span>'+
      '<button class="btn" style="padding:3px 8px;font-size:11px" onclick="addTItem('+bi+','+si+')">+ 항목</button> <span class="del" onclick="delSec('+bi+','+si+')">✕</span></div>';
      s.items.forEach((it,ii)=>{const r=rule(b.name,s.name,it);
        h+='<div class="admin-item"><span class="ce" contenteditable="true" style="flex:1" onblur="tplItem('+bi+','+si+','+ii+',this.textContent)">'+esc(it)+'</span>'+
        '<label class="reqchk"><input type="checkbox"'+(r.req?' checked':'')+' onchange="setRule(\''+js(b.name)+'\',\''+js(s.name)+'\',\''+js(it)+'\',\'req\',this.checked);renderAdmin()"> 필수</label>'+
        '<select class="minsel" onchange="setRule(\''+js(b.name)+'\',\''+js(s.name)+'\',\''+js(it)+'\',\'min\',+this.value)">'+
          [1,2,3,4].map(v=>'<option value="'+v+'"'+(r.min===v?' selected':'')+'>기준 '+v+'점</option>').join('')+'</select>'+
        '<button class="btn stdedit'+(hasStd(b.name,s.name,it)?' on':'')+'" onclick="toggleStd(\''+cssid(b.name+s.name+it)+'\')">기준</button>'+
        '<span class="del" onclick="delTItem('+bi+','+si+','+ii+')">✕</span></div>'+
        '<div class="stdbox" id="std_'+cssid(b.name+s.name+it)+'">'+
          STD_F.map(f=>'<div class="stdrow"><label>'+f[1]+'</label>'+
            '<input value="'+esc(std(b.name,s.name,it)[f[0]]||'')+'" placeholder="'+esc(stdPH(f[0]))+'" '+
            'oninput="setStd(\''+js(b.name)+'\',\''+js(s.name)+'\',\''+js(it)+'\',\''+f[0]+'\',this.value)"></div>').join('')+
        '</div>';});
      h+='</div>';});
    h+='</div>';});
  document.getElementById('app').innerHTML=h;
}
function stdPH(f){return {qty:'예: 머릿고기 80g, 순대 60g',time:'예: 육수 90℃ 이상, 조리 3분 이내',
  look:'예: 국물 탁도 균일, 고명 흐트러짐 없음',fail:'예: 육수 온도 미달, 건더기 중량 ±20% 초과'}[f]||'';}
function toggleStd(id){const el=document.getElementById('std_'+id);if(el)el.classList.toggle('open');}
function setPass(k,v){PASSCFG()[k]=v;saveTpl();renderAdmin();}
function bulkReq(v){if(!confirm(v?'모든 항목을 필수로 지정하시겠습니까?':'모든 항목의 필수 지정을 해제하시겠습니까?'))return;
  TPL.brands.forEach(b=>b.secs.forEach(s=>s.items.forEach(it=>{
    const key=K(b.name,s.name,it);const r=RULES()[key]||{};r.req=v;RULES()[key]=r;})));
  saveTpl();renderAdmin();}
function tplBrand(bi,v){TPL.brands[bi].name=v.trim();saveTpl();}
function tplSec(bi,si,v){TPL.brands[bi].secs[si].name=v.trim();saveTpl();}
function tplItem(bi,si,ii,v){TPL.brands[bi].secs[si].items[ii]=v.trim();saveTpl();}
function addBrand(){TPL.brands.push({name:'새 브랜드',secs:[{name:'1. 새 단계',items:['새 항목']}]});saveTpl();renderAdmin();}
function delBrand(bi){if(!confirm('브랜드를 삭제할까요?'))return;const nm=TPL.brands[bi].name;TPL.brands.splice(bi,1);ST.selected=ST.selected.filter(x=>x!==nm);saveTpl();saveSt();renderAdmin();}
function addSec(bi){TPL.brands[bi].secs.push({name:'새 단계',items:['새 항목']});saveTpl();renderAdmin();}
function delSec(bi,si){TPL.brands[bi].secs.splice(si,1);saveTpl();renderAdmin();}
function addTItem(bi,si){TPL.brands[bi].secs[si].items.push('새 항목');saveTpl();renderAdmin();}
function delTItem(bi,si,ii){TPL.brands[bi].secs[si].items.splice(ii,1);saveTpl();renderAdmin();}
function resetTpl(){if(!confirm('브랜드 템플릿을 기본값으로 복원할까요? (체크 기록은 유지)'))return;TPL=JSON.parse(JSON.stringify(DEF_TPL));TPL.v=3;saveTpl();renderAdmin();}

function exportSt(){const nm=(ST.store||'매장')+'_'+(ST.info.name||'교육생');dl(ST,'조리교육_'+nm+'.json');}
function exportTpl(){dl(TPL,'조리교육_브랜드템플릿.json');}
function dl(obj,name){const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
let impMode='st';
function pickImp(m){impMode=m;document.getElementById('imp').click();}
document.getElementById('imp').onchange=function(){const f=this.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(impMode==='tpl'){if(!d.brands)throw 0;TPL=d;saveTpl();renderAdmin();alert('템플릿을 불러와 전체에 적용했습니다.');}
    else{if(!d.checks)throw 0;ST=d;saveSt();render();alert('교육생 기록을 불러왔습니다.');}
  }catch(x){alert('파일 형식 오류');}};r.readAsText(f);this.value='';};
render();paintSave();
/* 미저장 내용이 없을 때만 서버 기록을 자동으로 불러옵니다 */
if(pushable()&&!hasContent())pullSync(true);
window.addEventListener('beforeunload',function(e){
  if(pushable()&&SY.dirty){clearTimeout(SY.timer);pushSync(false);
    e.preventDefault();e.returnValue='저장되지 않은 내용이 있습니다.';return e.returnValue;}});
</script></body></html>
